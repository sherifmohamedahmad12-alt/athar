name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          unzip -q Athar-Android-Project.zip -d project_dir
          if [ ! -f project_dir/settings.gradle.kts ] && [ ! -f project_dir/settings.gradle ]; then
            SUBDIR=$(find project_dir -maxdepth 2 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf "%h\n" | head -n 1)
            mv "$SUBDIR"/* ./
          else
            mv project_dir/* ./
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
